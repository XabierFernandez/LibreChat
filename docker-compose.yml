services:
  librechat:
    image: registry.librechat.ai/danny-avila/librechat:v0.8.5-rc1
    container_name: n3uron-librechat-v085
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_started
      ollama:
        condition: service_healthy
      rag_api:
        condition: service_healthy
      engram_init:
        condition: service_completed_successfully
      artifacts_bundler:
        condition: service_started
    ports:
      - "${PORT}:${PORT}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOST=0.0.0.0
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - CONFIG_PATH=/app/librechat.yaml
      - NO_INDEX=true
      - RAG_API_URL=http://rag_api:8000
      - ENGRAM_DATA_DIR=/app/data/engram
    volumes:
      - type: bind
        source: ./.env
        target: /app/.env
      - type: bind
        source: ./librechat.yaml
        target: /app/librechat.yaml
      - ./vendor/engram:/opt/engram:ro
      - ./data-engram:/app/data/engram
      - ./uploads:/app/uploads
      - ./images:/app/client/public/images
      - ./logs:/app/logs

  mongodb:
    image: mongo:8.0.20
    container_name: n3uron-librechat-v085-mongodb
    restart: unless-stopped
    command: mongod --noauth
    volumes:
      - ./data-node:/data/db

  vectordb:
    image: pgvector/pgvector:0.8.0-pg15-trixie
    container_name: n3uron-librechat-v085-vectordb
    restart: unless-stopped
    environment:
      - POSTGRES_DB=librechat_rag
      - POSTGRES_USER=librechat
      - POSTGRES_PASSWORD=librechat-rag-local
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U librechat -d librechat_rag
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - ./data-rag:/var/lib/postgresql/data

  rag_api:
    image: registry.librechat.ai/danny-avila/librechat-rag-api-dev:latest
    container_name: n3uron-librechat-v085-rag-api
    restart: unless-stopped
    depends_on:
      vectordb:
        condition: service_healthy
    environment:
      - RAG_PORT=8000
      - DB_HOST=vectordb
      - DB_PORT=5432
      - POSTGRES_DB=librechat_rag
      - POSTGRES_USER=librechat
      - POSTGRES_PASSWORD=librechat-rag-local
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 20s

  engram_init:
    image: registry.librechat.ai/danny-avila/librechat:v0.8.5-rc1
    container_name: n3uron-librechat-v085-engram-init
    restart: "no"
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -lc
      - |
        if ! /engram-data/.runtime-venv/bin/python -V >/dev/null 2>&1; then
          rm -rf /engram-data/.runtime-venv
          python -m venv /engram-data/.runtime-venv
        fi
        if ! /engram-data/.runtime-venv/bin/python -c "import mcp, pydantic" >/dev/null 2>&1; then
          /engram-data/.runtime-venv/bin/python -m pip install --no-cache-dir "pydantic>=2.0" "mcp>=1.2.0"
        fi
    volumes:
      - ./data-engram:/engram-data

  artifacts_bundler:
    image: ghcr.io/librechat-ai/codesandbox-client/bundler:latest
    container_name: n3uron-librechat-v085-artifacts-bundler
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - wget --quiet --tries=1 --spider http://127.0.0.1/ || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "8086:80"

  ollama:
    image: ollama/ollama:0.21.0
    container_name: n3uron-librechat-v085-ollama
    restart: unless-stopped
    environment:
      - OLLAMA_CONTEXT_LENGTH=32768
      - OLLAMA_MAX_LOADED_MODELS=1
    entrypoint:
      - /bin/sh
      - -lc
      - |
        /bin/ollama serve &
        sleep 5
        ollama pull llama3.2:3b
        ollama pull LiquidAI/lfm2.5-1.2b-instruct:latest
        wait
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          ollama list | grep -q 'llama3.2:3b' &&
          ollama list | grep -q 'LiquidAI/lfm2.5-1.2b-instruct'
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 20s
    volumes:
      - ./ollama:/root/.ollama
