services:
  librechat:
    image: registry.librechat.ai/danny-avila/librechat:v0.8.5-rc1
    container_name: n3uron-librechat-v085
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_started
      ollama:
        condition: service_healthy
      n3local-proxy:
        condition: service_started
    ports:
      - "${PORT}:${PORT}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOST=0.0.0.0
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - CONFIG_PATH=/app/librechat.yaml
      - NO_INDEX=true
    volumes:
      - type: bind
        source: ./.env
        target: /app/.env
      - type: bind
        source: ./librechat.yaml
        target: /app/librechat.yaml
      - ./uploads:/app/uploads
      - ./images:/app/client/public/images
      - ./logs:/app/logs

  n3local-proxy:
    build:
      context: ./n3local-proxy
    container_name: n3uron-librechat-v085-n3local-proxy
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - N3LOCAL_UPSTREAM_URL=http://host.docker.internal:4103/mcp
      - N3LOCAL_TOKEN=${N3LOCAL_TOKEN}
      - N3LOCAL_PROXY_TIMEOUT_SECONDS=120
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import sys,http.client; conn=http.client.HTTPConnection('127.0.0.1', 4104, timeout=5); conn.request('GET', '/mcp'); status=conn.getresponse().status; conn.close(); sys.exit(0 if status in (200, 202, 406) else 1)"
      interval: 20s
      timeout: 5s
      retries: 20
      start_period: 10s

  mongodb:
    image: mongo:8.0.20
    container_name: n3uron-librechat-v085-mongodb
    restart: unless-stopped
    command: mongod --noauth
    volumes:
      - ./data-node:/data/db

  ollama:
    image: ollama/ollama:latest
    container_name: n3uron-librechat-v085-ollama
    restart: unless-stopped
    environment:
      - OLLAMA_CONTEXT_LENGTH=32768
    entrypoint:
      - /bin/sh
      - -lc
      - |
        /bin/ollama serve &
        sleep 5
        ollama pull gemma4:e2b
        ollama pull LiquidAI/lfm2.5-1.2b-instruct:latest
        wait
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          ollama list | grep -q 'gemma4:e2b' &&
          ollama list | grep -q 'LiquidAI/lfm2.5-1.2b-instruct'
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 20s
    volumes:
      - ./ollama:/root/.ollama
