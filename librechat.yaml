version: 1.3.8
cache: true

interface:
  customWelcome: "N3uron LibreChat local workspace."
  modelSelect: true
  parameters: true
  presets: true
  bookmarks: true
  multiConvo: true
  memories: false
  fileSearch: true
  fileCitations: true
  runCode: false
  agents:
    use: true
    create: true
    share: false
    public: false
  prompts:
    use: true
    create: true
    share: false
    public: false
  marketplace:
    use: false
  mcpServers:
    use: true
    create: false
    share: false
    public: false

registration:
  socialLogins: []

actions:
  allowedDomains:
    - "host.docker.internal"
    - "localhost"

mcpSettings:
  allowedDomains:
    - "host.docker.internal"
    - "http://host.docker.internal:4103"
    - "localhost"
    - "http://localhost:4103"

memory:
  # Native LibreChat memory is intentionally disabled. Workflow memory is handled by Engram MCP.
  disabled: true

summarization:
  enabled: true
  provider: "OllamaLocal"
  model: "LiquidAI/lfm2.5-1.2b-instruct:latest"
  maxSummaryTokens: 1200
  reserveRatio: 0.08
  trigger:
    type: "token_count"
    value: 6000
  contextPruning:
    enabled: true
    keepLastAssistants: 4
    softTrimRatio: 0.25
    hardClearRatio: 0.55
    minPrunableToolChars: 4000

endpoints:
  agents:
    capabilities: ["tools", "file_search"]
  custom:
    - name: "OllamaLocal"
      apiKey: "ollama"
      baseURL: "http://ollama:11434/v1/"
      models:
        default:
          - "n3ops"
          - "gemma4:e2b"
          - "LiquidAI/lfm2.5-1.2b-instruct:latest"
        fetch: true
      titleConvo: true
      titleMethod: "completion"
      titleModel: "LiquidAI/lfm2.5-1.2b-instruct:latest"
      titleMessageRole: "user"
      modelDisplayLabel: "Ollama Local"
      dropParams:
        - "user"
        - "frequency_penalty"
        - "presence_penalty"

modelSpecs:
  prioritize: true
  list:
    - name: "n3uron-ops-local"
      label: "N3uron Ops"
      default: true
      description: "Tool-capable local workflow for N3uron operations."
      mcpServers:
        - "N3LOCAL"
        - "engram"
      preset:
        endpoint: "OllamaLocal"
        model: "n3ops"
        modelLabel: "N3uron Ops"
        greeting: "Ask about live N3uron state, alarms, assets, or maintenance. N3LOCAL operational tools, RAG file search, and Engram workflow memory are enabled for this profile."
        promptPrefix: |
          N3uron Operations Mode.

          TOOL ROUTING — apply before every response:
          - "status" / "is X running" / "health" → system_status first
          - "alarm" / "fault" / "error" → alarm_get, then alarm_history if trend needed
          - tag name or measurement → tag_find to resolve, then tag_history if historical
          - "module" / "config" / "installed" → module_details or module_getConfigData
          - "why" / "diagnose" / root cause → gather all relevant tool results first, then reason
          - documentation / procedure / spec → request RAG retrieval, not model knowledge

          VALIDATION before any calculation:
          - confirm all inputs gathered from tools
          - confirm time range is explicit (not "recent" or "latest" without timestamp)
          - confirm units are consistent
          - if any input missing: report gap, do not estimate

          MEMORY + KNOWLEDGE BOUNDARIES:
          - N3LOCAL is source of truth for live and historical plant data
          - RAG/file search is source for manuals, reports, procedures, and documentation
          - Engram is workflow memory only: compact checkpoints, prior steps, operator decisions, blockers, conclusions, next actions
          - never store raw historian values, alarm dumps, full tool outputs, or full chat transcripts in Engram
        maxContextTokens: 8192
        temperature: 0.01
    - name: "gemma4-local-chat"
      label: "Gemma 4 E2B"
      description: "General local chat profile without MCP tools."
      preset:
        endpoint: "OllamaLocal"
        model: "gemma4:e2b"
        modelLabel: "Gemma 4 E2B"
        maxContextTokens: 32768
        temperature: 0.2
    - name: "lfm25-local-fast"
      label: "LFM 2.5 Fast"
      description: "Fast local plain-chat profile without MCP tools."
      preset:
        endpoint: "OllamaLocal"
        model: "LiquidAI/lfm2.5-1.2b-instruct:latest"
        modelLabel: "LFM 2.5 Fast"
        maxContextTokens: 8192
        temperature: 0.1

mcpServers:
  N3LOCAL:
    type: "streamable-http"
    url: "http://host.docker.internal:4103/mcp"
    requiresOAuth: false
    chatMenu: true
    serverInstructions: true
    initTimeout: 150000
    headers:
      Authorization: "Bearer ${N3LOCAL_TOKEN}"
    timeout: 900000
    autoConnect: false
  engram:
    type: "stdio"
    command: "sh"
    args:
      - "-lc"
      - >-
        test -x /app/data/engram/.venv/bin/python ||
        python -m venv /app/data/engram/.venv >/dev/null 2>&1;
        . /app/data/engram/.venv/bin/activate;
        python -m pip --version >/dev/null 2>&1 ||
        python -m ensurepip --upgrade >/dev/null 2>&1;
        python -c "import mcp, pydantic" >/dev/null 2>&1 ||
        python -m pip install --quiet --no-cache-dir "pydantic>=2.0" "mcp>=1.2.0" >/tmp/engram-pip.log 2>&1;
        exec python -m mcp_server.server
    env:
      ENGRAM_DATA_DIR: "${ENGRAM_DATA_DIR}"
      PYTHONPATH: "/opt/engram/src:/opt/engram"
    startup: true
    chatMenu: false
    initTimeout: 240000
    timeout: 120000
    serverInstructions: |
      Use Engram only for compact workflow memory:
      - checkpoint investigation steps, operator decisions, blockers, conclusions, next actions
      - do not store raw historian data, alarm dumps, full tool outputs, or full chat transcripts
      - retrieve prior checkpoints when resuming long-running investigations
