version: 1.3.8
cache: true

interface:
  customWelcome: "N3uron LibreChat local workspace."
  modelSelect: true
  parameters: true
  presets: false
  bookmarks: true
  multiConvo: true
  memories: false
  fileSearch: true
  fileCitations: true
  runCode: false
  agents:
    use: true
    create: true
    share: false
    public: false
  prompts:
    use: true
    create: true
    share: false
    public: false
  marketplace:
    use: false
  mcpServers:
    use: true
    create: false
    share: false
    public: false

registration:
  socialLogins: []

actions:
  allowedDomains:
    - "host.docker.internal"
    - "localhost"

mcpSettings:
  allowedDomains:
    - "host.docker.internal"
    - "http://host.docker.internal:4103"
    - "localhost"
    - "http://localhost:4103"

memory:
  # Native LibreChat memory is intentionally disabled. Workflow memory is handled by Engram MCP.
  disabled: true

summarization:
  enabled: true
  provider: "OllamaFast"
  model: "LiquidAI/lfm2.5-1.2b-instruct:latest"
  maxSummaryTokens: 1200
  reserveRatio: 0.08
  trigger:
    type: "token_count"
    value: 22000
  contextPruning:
    enabled: true
    keepLastAssistants: 4
    softTrimRatio: 0.25
    hardClearRatio: 0.55
    minPrunableToolChars: 12000

endpoints:
  agents:
    capabilities: ["tools", "file_search", "artifacts", "deferred_tools"]
  custom:
    - name: "OllamaOps"
      apiKey: "ollama"
      baseURL: "http://ollama:11434/v1/"
      models:
        default:
          - "n3ops:latest"
          - "gemma4:e2b"
        fetch: false
      titleConvo: true
      titleMethod: "completion"
      titleModel: "LiquidAI/lfm2.5-1.2b-instruct:latest"
      titleMessageRole: "user"
      modelDisplayLabel: "Ollama Ops"
      maxToolResultChars: 5000
      dropParams:
        - "user"
        - "frequency_penalty"
        - "presence_penalty"
    - name: "OllamaFast"
      apiKey: "ollama"
      baseURL: "http://ollama:11434/v1/"
      models:
        default:
          - "LiquidAI/lfm2.5-1.2b-instruct:latest"
        fetch: false
      titleConvo: true
      titleMethod: "completion"
      titleModel: "current_model"
      titleMessageRole: "user"
      modelDisplayLabel: "Ollama Fast"
      dropParams:
        - "user"
        - "frequency_penalty"
        - "presence_penalty"

modelSpecs:
  prioritize: true
  list:
    - name: "n3uron-ops-docker"
      label: "N3uron Ops Docker"
      default: true
      description: "Tool-capable local workflow for N3uron operations."
      artifacts: true
      mcpServers:
        - "N3OPS"
        - "engram"
      preset:
        endpoint: "OllamaOps"
        model: "n3ops:latest"
        modelLabel: "N3uron Ops Docker"
        greeting: "Ask about live N3uron state, alarms, assets, or maintenance. Filtered N3uron operations tools, RAG file search, and Engram workflow memory are enabled for this dockerized profile."
        promptPrefix: |
          N3uron operations assistant.
          Use N3OPS for live and historical plant data from the N3uron MCP source.
          Use RAG/file search for manuals, reports, procedures, and documentation.
          Use Engram only for compact workflow memory: checkpoints, decisions, blockers, conclusions, next actions.
          Never store raw historian values, alarm dumps, full tool outputs, full chat transcripts, generated HTML/code, artifacts, or copied report text in Engram.
          If the request depends on current status, alarms, tags, modules, or history, call the relevant tool first.
          If N3OPS does not expose the exact tool you need, say so explicitly instead of guessing.
          If inputs, timestamps, or units are missing, state the gap and do not estimate.
        maxContextTokens: 24576
        temperature: 0.01
    - name: "gemma4-local-chat"
      label: "Gemma 4 E2B"
      description: "General local chat profile without MCP tools."
      preset:
        endpoint: "OllamaOps"
        model: "gemma4:e2b"
        modelLabel: "Gemma 4 E2B"
        maxContextTokens: 24576
        temperature: 0.2
    - name: "lfm25-local-fast"
      label: "LFM 2.5 Fast"
      description: "Fast local plain-chat profile without MCP tools."
      preset:
        endpoint: "OllamaFast"
        model: "LiquidAI/lfm2.5-1.2b-instruct:latest"
        modelLabel: "LFM 2.5 Fast"
        maxContextTokens: 8192
        temperature: 0.1

mcpServers:
  N3LOCAL:
    type: "streamable-http"
    url: "http://host.docker.internal:4103/mcp"
    requiresOAuth: false
    chatMenu: true
    serverInstructions: true
    initTimeout: 150000
    headers:
      Authorization: "Bearer ${N3LOCAL_TOKEN}"
    timeout: 900000
    autoConnect: false
  N3OPS:
    type: "stdio"
    command: "/app/data/engram/.runtime-venv/bin/python"
    args:
      - "/opt/n3ops_mcp/server.py"
    env:
      N3LOCAL_URL: "http://host.docker.internal:4103/mcp"
      N3LOCAL_TOKEN: "${N3LOCAL_TOKEN}"
    startup: false
    chatMenu: false
    initTimeout: 240000
    timeout: 900000
    serverInstructions: false
  engram:
    type: "stdio"
    requiresOAuth: false
    command: "/app/data/engram/.runtime-venv/bin/python"
    args:
      - "-m"
      - "mcp_server.server"
    env:
      ENGRAM_DATA_DIR: "${ENGRAM_DATA_DIR}"
      ENGRAM_DB_PATH: "/app/data/engram/memory.db"
      ENGRAM_TOOL_PROFILE: "workflow"
      ENGRAM_WORKFLOW_MAX_CHARS: "500"
      ENGRAM_WORKFLOW_MAX_ITEM_CHARS: "180"
      PYTHONPATH: "/opt/engram/src:/opt/engram"
    startup: false
    chatMenu: false
    initTimeout: 240000
    timeout: 120000
    serverInstructions: false
