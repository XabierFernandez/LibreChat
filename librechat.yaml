version: 1.3.8
cache: true

interface:
  customWelcome: "N3uron LibreChat local workspace."
  modelSelect: true
  parameters: true
  presets: false
  bookmarks: true
  multiConvo: true
  memories: false
  fileSearch: true
  fileCitations: true
  runCode: false
  agents:
    use: true
    create: true
    share: false
    public: false
  prompts:
    use: true
    create: true
    share: false
    public: false
  marketplace:
    use: false
  mcpServers:
    use: true
    create: false
    share: false
    public: false

registration:
  socialLogins: []

actions:
  allowedDomains:
    - "host.docker.internal"
    - "localhost"

mcpSettings:
  allowedDomains:
    - "host.docker.internal"
    - "http://host.docker.internal:4103"
    - "localhost"
    - "http://localhost:4103"

memory:
  # Native LibreChat memory is intentionally disabled. Workflow memory is handled by Engram MCP.
  disabled: true

summarization:
  enabled: true
  provider: "LLMsterLocal"
  model: "gemma-4-e2b-it"
  maxSummaryTokens: 1200
  reserveRatio: 0.08
  trigger:
    type: "token_count"
    value: 22000
  contextPruning:
    enabled: true
    keepLastAssistants: 4
    softTrimRatio: 0.25
    hardClearRatio: 0.55
    minPrunableToolChars: 12000

endpoints:
  agents:
    capabilities: ["tools", "file_search", "artifacts", "deferred_tools"]
  custom:
    - name: "LLMsterLocal"
      apiKey: "llmster"
      baseURL: "http://llmster:1234/v1/"
      models:
        default:
          - "gemma-4-e2b-it"
        fetch: false
      addParams:
        top_k: 50
        repeat_penalty: 1.05
      titleConvo: true
      titleMethod: "completion"
      titleModel: "current_model"
      titleMessageRole: "user"
      modelDisplayLabel: "LLMster Gemma"
      maxToolResultChars: 5000
      dropParams:
        - "user"
        - "frequency_penalty"
        - "presence_penalty"

modelSpecs:
  prioritize: true
  list:
    - name: "n3-o-m"
      label: "N3 O&M"
      default: true
      description: "Tool-capable N3uron operations workflow on llmster + Gemma 4 E2B."
      artifacts: true
      fileSearch: true
      mcpServers:
        - "N3OPS"
        - "engram"
      preset:
        endpoint: "LLMsterLocal"
        model: "gemma-4-e2b-it"
        modelLabel: "N3 O&M"
        greeting: "Ask about live N3uron state, alarms, assets, manuals, reports, or maintenance. N3OPS, RAG file search, Engram workflow memory, and artifacts are enabled for this dockerized profile."
        promptPrefix: |
          # N3uron IIoT/SCADA Analyst

          You analyze industrial assets and systems using live and historical
          process data from N3uron, alongside user-provided documentation.
          Your outputs are audit-ready: every finding is traceable to a source,
          every number is provable.

          ---

          ## Data Integrity — Non-Negotiable

          No invented numbers. Never fabricate, estimate, interpolate,
          or use benchmarks unless the user explicitly provides a value and
          labels it as a reference.

          Every number requires a source:
          - Tool output -> tool name + timestamp + tag path(s) / time range
          - Uploaded file -> filename + section/table + page
          - User-provided -> "User-provided value"

          Show your math. For every derived value:
          inputs (with sources) -> formula -> result (with units)
          If any input is missing, do not calculate -> state what is missing.

          Units discipline. Confirm units are consistent throughout.
          Flag any ambiguity before calculating.

          No speculative language. Never use: typical / approximately /
          usually / industry standard / based on similar equipment.

          When data is missing, say exactly:
          - "I need to run [tool] to obtain [metric] before I can continue."
          - "I cannot find [value] after searching. Please provide it or confirm where it appears."

          ---

          Use N3OPS for live and historical plant data from the N3uron MCP source of truth.
          Use RAG/file search for manuals, reports, procedures, and documentation.
          Use Engram only for compact workflow memory: checkpoints, decisions, blockers, conclusions, and next actions.
          For LibreChat artifacts, do not call an artifact_create tool. Emit artifact content as a markdown artifact block:
          :::artifact{identifier="your-id" type="text/html" title="Your Title"}
          ```html
          ...
          ```
          :::
          Never store raw historian values, alarm dumps, full tool outputs, full chat transcripts, generated HTML/code, artifacts, or copied report text in Engram.
          If the request depends on current status, alarms, tags, modules, or history, call the relevant tool first.
          If N3OPS does not expose the exact tool you need, say so explicitly instead of guessing.
          If inputs, timestamps, or units are missing, state the gap and do not estimate.
        maxContextTokens: 32768
        temperature: 0.01

mcpServers:
  N3LOCAL:
    type: "streamable-http"
    url: "http://host.docker.internal:4103/mcp"
    requiresOAuth: false
    chatMenu: true
    serverInstructions: true
    initTimeout: 150000
    headers:
      Authorization: "Bearer ${N3LOCAL_TOKEN}"
    timeout: 900000
    autoConnect: false
  N3OPS:
    type: "stdio"
    requiresOAuth: false
    command: "/app/data/engram/.runtime-venv/bin/python"
    args:
      - "/opt/n3ops_mcp/server.py"
    env:
      N3LOCAL_URL: "http://host.docker.internal:4103/mcp"
      N3LOCAL_TOKEN: "${N3LOCAL_TOKEN}"
    startup: false
    chatMenu: false
    initTimeout: 240000
    timeout: 900000
    serverInstructions: false
  engram:
    type: "stdio"
    requiresOAuth: false
    command: "/app/data/engram/.runtime-venv/bin/python"
    args:
      - "-m"
      - "mcp_server.server"
    env:
      ENGRAM_DATA_DIR: "${ENGRAM_DATA_DIR}"
      ENGRAM_DB_PATH: "/app/data/engram/memory.db"
      ENGRAM_TOOL_PROFILE: "workflow"
      ENGRAM_WORKFLOW_MAX_CHARS: "500"
      ENGRAM_WORKFLOW_MAX_ITEM_CHARS: "180"
      PYTHONPATH: "/opt/engram/src:/opt/engram"
    startup: false
    chatMenu: false
    initTimeout: 240000
    timeout: 120000
    serverInstructions: false
