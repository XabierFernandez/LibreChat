version: 1.3.8
cache: true

interface:
  customWelcome: "N3uron LibreChat local workspace."
  modelSelect: false
  parameters: true
  presets: false
  bookmarks: true
  multiConvo: true
  memories: false
  fileSearch: true
  fileCitations: true
  runCode: false
  agents:
    use: false
    create: false
    share: false
    public: false
  prompts:
    use: true
    create: true
    share: false
    public: false
  marketplace:
    use: false
  mcpServers:
    use: true
    create: false
    share: false
    public: false

registration:
  socialLogins: []

actions:
  allowedDomains:
    - "host.docker.internal"
    - "localhost"

mcpSettings:
  allowedDomains:
    - "host.docker.internal"
    - "http://host.docker.internal:4103"
    - "localhost"
    - "http://localhost:4103"

memory:
  disabled: true

summarization:
  enabled: true
  provider: "OllamaLocal"
  model: "gemma4:26b"
  maxSummaryTokens: 1200
  reserveRatio: 0.08
  trigger:
    type: "token_count"
    value: 11000
  contextPruning:
    enabled: true
    keepLastAssistants: 4
    softTrimRatio: 0.25
    hardClearRatio: 0.55
    minPrunableToolChars: 12000

endpoints:
  agents:
    disableBuilder: true
    allowedProviders: ["OllamaLocal"]
    capabilities: ["tools", "file_search", "artifacts"]
  custom:
    - name: "OllamaLocal"
      apiKey: "ollama"
      baseURL: "http://ollama:11434/v1/"
      models:
        default:
          - "gemma4:26b"
        fetch: false
      titleConvo: false
      titleMethod: "completion"
      titleModel: "current_model"
      titleMessageRole: "user"
      modelDisplayLabel: "Ollama Gemma 4 26B"
      maxToolResultChars: 5000
      dropParams:
        - "user"
        - "frequency_penalty"
        - "presence_penalty"

modelSpecs:
  prioritize: true
  list:
    - name: "n3-o-m"
      label: "N3 O&M"
      default: true
      description: "Single-preset N3uron operations workflow on Ollama Gemma 4 26B A4B."
      artifacts: true
      fileSearch: true
      mcpServers:
        - "N3OPS"
        - "engram"
      preset:
        endpoint: "OllamaLocal"
        model: "gemma4:26b"
        modelLabel: "N3 O&M"
        disableStreaming: true
        greeting: "Ask about live N3uron state, alarms, assets, manuals, reports, or maintenance. N3OPS, RAG file search, Engram workflow memory, and artifacts are enabled for this profile."
        promptPrefix: |
          N3uron operations assistant.
          Use N3OPS as the source of truth for live and historical plant data.
          Use RAG/file search for manuals, reports, procedures, and documentation.
          Use Engram only for compact workflow memory: checkpoints, decisions, blockers, conclusions, and next actions.
          Never invent values, estimate missing data, or hide unit ambiguity.
          Every reported number must cite its source:
          - tool output -> tool name + timestamp + tag path(s) or time range
          - uploaded file -> filename + section/table + page
          - user input -> "User-provided"
          If data is missing, say exactly what tool or value is needed before continuing.
          For derived values, show inputs, formula, result, and units.
          Do not store raw historian values, alarm dumps, full tool outputs, transcripts, generated HTML/code, or copied report text in Engram.
          For LibreChat artifacts, do not call `artifact_create`.
          Emit markdown artifact blocks only:
          :::artifact{identifier="your-id" type="text/html" title="Your Title"}
          ```html
          ...
          ```
          :::
        maxContextTokens: 16384
        temperature: 0.01

mcpServers:
  N3OPS:
    type: "stdio"
    requiresOAuth: false
    command: "/app/data/engram/.runtime-venv/bin/python"
    args:
      - "/opt/n3ops_mcp/server.py"
    env:
      N3LOCAL_URL: "http://host.docker.internal:4103/mcp"
      N3LOCAL_TOKEN: "${N3LOCAL_TOKEN}"
      N3OPS_TOOL_PROFILE: "core"
    startup: false
    chatMenu: false
    initTimeout: 240000
    timeout: 900000
    serverInstructions: false
  engram:
    type: "stdio"
    requiresOAuth: false
    command: "/app/data/engram/.runtime-venv/bin/python"
    args:
      - "-m"
      - "mcp_server.server"
    env:
      ENGRAM_DATA_DIR: "${ENGRAM_DATA_DIR}"
      ENGRAM_DB_PATH: "/app/data/engram/memory.db"
      ENGRAM_TOOL_PROFILE: "workflow"
      ENGRAM_WORKFLOW_MAX_CHARS: "500"
      ENGRAM_WORKFLOW_MAX_ITEM_CHARS: "180"
      PYTHONPATH: "/opt/engram/src:/opt/engram"
    startup: false
    chatMenu: false
    initTimeout: 240000
    timeout: 120000
    serverInstructions: false
