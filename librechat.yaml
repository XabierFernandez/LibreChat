version: 1.3.8
cache: true

interface:
  customWelcome: "N3uron LibreChat local workspace."
  modelSelect: true
  parameters: true
  presets: true
  bookmarks: true
  multiConvo: true
  fileSearch: false
  fileCitations: false
  runCode: false
  agents:
    use: true
    create: true
    share: false
    public: false
  prompts:
    use: true
    create: true
    share: false
    public: false
  marketplace:
    use: false
  mcpServers:
    use: true
    create: false
    share: false
    public: false

registration:
  socialLogins: []

actions:
  allowedDomains:
    - "host.docker.internal"
    - "localhost"
    - "n3local-proxy"

mcpSettings:
  allowedDomains:
    - "host.docker.internal"
    - "http://host.docker.internal:4103"
    - "localhost"
    - "http://localhost:4103"
    - "n3local-proxy"
    - "http://n3local-proxy:4104"

memory:
  disabled: true
  personalize: true
  validKeys:
    - "user_preferences"
    - "conversation_context"
    - "learned_facts"
  tokenLimit: 1200
  charLimit: 4000
  messageWindowSize: 5
  agent:
    provider: "OllamaLocal"
    model: "LiquidAI/lfm2.5-1.2b-instruct:latest"
    instructions: |
      Store only stable user preferences, durable project facts, and active long-lived work context.
      Do not store transient prompts, tool traces, or large copied outputs.
    model_parameters:
      temperature: 0.1
      max_tokens: 600

summarization:
  provider: "OllamaLocal"
  model: "LiquidAI/lfm2.5-1.2b-instruct:latest"
  maxSummaryTokens: 1200
  reserveRatio: 0.08
  trigger:
    type: "token_count"
    value: 22000
  contextPruning:
    enabled: true
    keepLastAssistants: 4
    softTrimRatio: 0.25
    hardClearRatio: 0.55
    minPrunableToolChars: 12000

endpoints:
  agents:
    capabilities: ["tools"]
  custom:
    - name: "OllamaLocal"
      apiKey: "ollama"
      baseURL: "http://ollama:11434/v1/"
      models:
        default:
          - "gemma4:e2b"
          - "LiquidAI/lfm2.5-1.2b-instruct:latest"
        fetch: true
      titleConvo: true
      titleMethod: "completion"
      titleModel: "LiquidAI/lfm2.5-1.2b-instruct:latest"
      titleMessageRole: "user"
      modelDisplayLabel: "Ollama Local"
      dropParams:
        - "user"
        - "frequency_penalty"
        - "presence_penalty"

modelSpecs:
  prioritize: true
  list:
    - name: "n3uron-ops-local"
      label: "N3uron Ops"
      default: true
      description: "Tool-capable local workflow for N3uron operations."
      mcpServers:
        - "N3LOCAL"
      preset:
        endpoint: "OllamaLocal"
        model: "gemma4:e2b"
        modelLabel: "N3uron Ops"
        greeting: "Ask about live N3uron state, alarms, assets, or maintenance. N3LOCAL tools are enabled for this profile."
        promptPrefix: |
          You are a local N3uron operations assistant.
          Use N3LOCAL MCP tools when the request depends on live plant or node data.
          For requests about current system or node status, call system_status immediately before any narrative.
          Prefer the smallest sufficient tool set and summarize results for an operator.
          Do not expose internal reasoning or hidden chain-of-thought.
          When you report a metric or status, tie it to the tool result rather than guessing.
        maxContextTokens: 32768
        temperature: 0.1
    - name: "gemma4-local-chat"
      label: "Gemma 4 E2B"
      description: "General local chat profile without MCP tools."
      preset:
        endpoint: "OllamaLocal"
        model: "gemma4:e2b"
        modelLabel: "Gemma 4 E2B"
        maxContextTokens: 32768
        temperature: 0.2
    - name: "lfm25-local-fast"
      label: "LFM 2.5 Fast"
      description: "Fast local plain-chat profile without MCP tools."
      preset:
        endpoint: "OllamaLocal"
        model: "LiquidAI/lfm2.5-1.2b-instruct:latest"
        modelLabel: "LFM 2.5 Fast"
        maxContextTokens: 8192
        temperature: 0.1

mcpServers:
  N3LOCAL:
    type: "streamable-http"
    url: "http://n3local-proxy:4104/mcp"
    requiresOAuth: false
    chatMenu: true
    serverInstructions: true
    initTimeout: 150000
    headers:
      Authorization: "Bearer ${N3LOCAL_TOKEN}"
    timeout: 900000
    autoConnect: false
